[package]
name = "e2e"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dev-dependencies]
base64 = "0.22"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
libc = "0.2"
nss-oidc = { path = "../nss_oidc" }
pam-oidc = { path = "../pam_oidc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sssd-oidc = { path = "../.." }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
