[package]
name = "mock-idp"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Standalone mock SCIM + OIDC server for container E2E tests"

[[bin]]
name = "mock-idp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
wiremock = "0.6"
