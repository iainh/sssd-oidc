name: Build RPM (RHEL 9)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rpm:
    name: Build RPM on CentOS Stream 9
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream9
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y --enablerepo=crb \
            gcc make pam-devel rpm-build rpmdevtools \
            perl-interpreter tar gzip findutils \
            git

      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up rpmbuild tree
        run: rpmdev-setuptree

      - name: Create source tarball
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p "sssd-oidc-${VERSION}"
          # Copy source tree (excluding build artifacts and .git)
          tar --exclude='./target' --exclude='./.git' --exclude='./.jj' \
              --exclude="./sssd-oidc-${VERSION}" \
              -cf - . | tar -xf - -C "sssd-oidc-${VERSION}"
          tar czf "$HOME/rpmbuild/SOURCES/sssd-oidc-${VERSION}.tar.gz" "sssd-oidc-${VERSION}"
          rm -rf "sssd-oidc-${VERSION}"

      - name: Build RPM
        run: |
          source "$HOME/.cargo/env"
          rpmbuild -ba dist/rpm/sssd-oidc.spec

      - name: List built RPMs
        run: find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -name '*.rpm' -print

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sssd-oidc-rpms
          path: |
            ~/rpmbuild/RPMS/**/*.rpm
            ~/rpmbuild/SRPMS/*.rpm

  # Smoke-test: install the RPM in a clean UBI 9 container
  test-rpm:
    name: Test RPM install
    runs-on: ubuntu-latest
    needs: build-rpm
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    steps:
      - name: Install dependencies
        run: dnf install -y findutils

      - name: Download RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: sssd-oidc-rpms
          path: rpms

      - name: Install RPM
        run: |
          RPM=$(find rpms -name 'sssd-oidc-*.rpm' -not -name '*.src.rpm' | head -1)
          echo "Installing: $RPM"
          rpm -ivh --nodeps "$RPM"

      - name: Verify installed files
        run: |
          set -e
          echo "--- Checking NSS module ---"
          ls -la /usr/lib64/libnss_oidc.so.2
          echo "--- Checking PAM module ---"
          ls -la /usr/lib64/security/pam_oidc.so
          echo "--- Checking config ---"
          ls -la /etc/sssd-oidc/config.toml
          echo "--- Checking cache directory ---"
          test -d /var/lib/sssd-oidc
          echo "--- RPM file list ---"
          rpm -ql sssd-oidc
          echo "--- All checks passed ---"

  # Publish RPM to GitHub Release on tags
  release:
    name: Publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test-rpm
    permissions:
      contents: write
    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: sssd-oidc-rpms
          path: rpms

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: rpms/**/*.rpm
